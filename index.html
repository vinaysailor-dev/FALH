<!DOCTYPE html>
<html>
<head>

<meta charset="utf-8">

<body class="multiple-scenes ">

<div id="pinLock">
  <div id="pinLockBox">
    <div id="pinDigits">
      <input type="text" class="pinDigit" inputmode="numeric" pattern="[0-9]*" maxlength="1" autocomplete="off">
      <input type="text" class="pinDigit" inputmode="numeric" pattern="[0-9]*" maxlength="1" autocomplete="off">
      <input type="text" class="pinDigit" inputmode="numeric" pattern="[0-9]*" maxlength="1" autocomplete="off">
      <input type="text" class="pinDigit" inputmode="numeric" pattern="[0-9]*" maxlength="1" autocomplete="off">
    </div>
    <div id="pinLabel">Enter PIN <span id="pinCancel">Cancel</span></div>
    <p id="pinError">Incorrect PIN. Try again.</p>
  </div>
</div>

<div id="pano"></div>

<div id="sceneList">
  <ul class="scenes">
    
      <a href="javascript:void(0)" class="scene" data-id="0-falh-interactive-wall-jpg">
        <li class="text">FALH INTERACTIVE WALL JPG</li>
      </a>
    
      <a href="javascript:void(0)" class="scene" data-id="1-falh-play-area-jpg">
        <li class="text">FALH PLAY AREA JPG</li>
      </a>
    
  </ul>
</div>

<div id="titleBar">
  <h1 class="sceneName"></h1>
</div>

<a href="javascript:void(0)" id="autorotateToggle">
  <img class="icon off" src="img/play.png">
  <img class="icon on" src="img/pause.png">
</a>

<a href="javascript:void(0)" id="fullscreenToggle">

  <img class="icon" src="img/up.png">
</a>
<a href="javascript:void(0)" id="viewDown" class="viewControlButton viewControlButton-2">

<script src="vendor/screenfull.min.js" ></script>
<script src="vendor/bowser.min.js" ></script>
<script src="vendor/marzipano.js" ></script>

<script src="data.js"></script>
<script src="index.js"></script>

<script>
(function () {
  var CORRECT_PIN = "2626"; // <-- change this to whatever PIN you want

  var lock = document.getElementById("pinLock");
  var digits = Array.prototype.slice.call(document.querySelectorAll(".pinDigit"));
  var error = document.getElementById("pinError");
  var cancel = document.getElementById("pinCancel");

  function currentValue() {
    return digits.map(function (d) { return d.value; }).join("");
  }

  function clearDigits() {
    digits.forEach(function (d) { d.value = ""; });
    digits[0].focus();
  }

  function tryUnlock() {
    if (currentValue() === CORRECT_PIN) {
      lock.classList.add("unlocked");
      setTimeout(function () {
        lock.style.display = "none";
      }, 400);
    } else {
      error.classList.add("visible");
      digits.forEach(function (d) { d.classList.add("shake"); });
      setTimeout(function () {
        digits.forEach(function (d) { d.classList.remove("shake"); });
        clearDigits();
      }, 300);
    }
  }

  digits.forEach(function (digit, i) {
    digit.addEventListener("input", function () {
      digit.value = digit.value.replace(/[^0-9]/g, "").slice(-1);
      error.classList.remove("visible");
      if (digit.value && i < digits.length - 1) {
        digits[i + 1].focus();
      }
      if (digits.every(function (d) { return d.value; })) {
        tryUnlock();
      }
    });

    digit.addEventListener("keydown", function (e) {
      if (e.key === "Backspace" && !digit.value && i > 0) {
        digits[i - 1].focus();
      }
    });
  });

  cancel.addEventListener("click", clearDigits);

  // Focus the first box as soon as the page loads
  window.addEventListener("load", function () {
    digits[0].focus();
  });
})();
</script>

</body>
</html>
